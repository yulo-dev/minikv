name: bench

# Benchmarks are slow and noisy on shared runners, so they only run on request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Engine benchmarks
        run: ./gradlew benchReport --no-daemon
      - name: Upload results
        uses: actions/upload-artifact@v5
        with:
          name: engine-results
          path: docs/results.md
